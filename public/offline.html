<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#181825" />
    <title>Offline - Make or Break</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #181825;
        color: #cdd6f4;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 28rem; }
      img { width: 72px; height: 72px; margin-bottom: 20px; opacity: 0.9; }
      h1 { font-size: 1.5rem; margin: 0 0 10px; color: #cba6f7; font-weight: 700; }
      p { margin: 0 0 22px; line-height: 1.6; color: #a6adc8; font-size: 0.95rem; }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 11px 22px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        background: #cba6f7;
        color: #181825;
      }
      button:hover { background: #b4befe; }
      .hint { margin-top: 18px; font-size: 0.8rem; color: #6c7086; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Make or Break" />
      <h1>You are offline</h1>
      <p>
        This page needs a connection. Lessons and pages you have already opened
        stay available. Reconnect to pick up where you left off.
      </p>
      <button onclick="location.reload()">Try again</button>
      <div class="hint">Make or Break works best online, but reading you have already loaded is cached.</div>
    </div>
  </body>
</html>
